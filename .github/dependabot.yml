version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "yao-enqi"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    # 分组策略：小版本一起升，大版本单独人工评估
    groups:
      androidx-minor:
        patterns:
          - "androidx.*"
        update-types:
          - "minor"
          - "patch"
      kotlin-minor:
        patterns:
          - "org.jetbrains.kotlin*"
        update-types:
          - "minor"
          - "patch"
    # 大版本升级需要人工审查，不自动开 PR
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
